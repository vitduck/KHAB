config:
  model: meta-llama/Llama-3.1-8B-Instruct
  backend: pytorch
  outdir: ./output

  sharding:
    - {nnodes: 1, pp: 1, tp: 1}
    - {nnodes: 1, pp: 1, tp: 2}
    - {nnodes: 2, pp: 1, tp: 16}
    - {nnodes: 2, pp: 2, tp: 8}

  max_seq_len: 4096
  max_batch_sizes: 2048
  max_num_tokens: 8192
  kv_cache_fraction: 0.90

  warmup: 10

  workloads:
    - {input_mean: 128, output_mean: 128, num_requests: 30000}
    - {input_mean: 128, output_mean: 2048, num_requests: 3000}
    - {input_mean: 2048, output_mean: 128, num_requests: 3000}

throughput:
  num_requests: 1000
  concurrency: ['auto',16, 24, 32]

latency:
  num_requests: 100
